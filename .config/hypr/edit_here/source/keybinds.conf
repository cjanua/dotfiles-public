# ==============================================================================
# USER CONFIGURATION: keybinds.conf
# ==============================================================================
# Add your custom settings for keybinds here.
# These will override or add to the defaults found in ~/.config/hypr/source/keybinds.conf
# ==============================================================================

# Variables
$scripts = $HOME/user_scripts
$browser = zen-browser
$terminal = kitty

# Unbind ALL conflicting defaults before remapping
unbind = ALT, 0
unbind = ALT, 7
unbind = ALT, 8
unbind = ALT, 9
unbind = ALT, F7
unbind = ALT, F8
unbind = ALT, I
unbind = ALT, M
unbind = ALT, 4
unbind = ALT, P
unbind = ALT, B
unbind = ALT, 5
unbind = SHIFT ALT, 5

unbind = ALT, O
unbind = ALT, V
unbind = $mainMod ALT, A
unbind = $mainMod ALT, D
unbind = $mainMod ALT, M
unbind = $mainMod ALT, N
unbind = $mainMod ALT, O
unbind = $mainMod, O
unbind = $mainMod ALT, period
unbind = $mainMod, period
unbind = $mainMod, X

unbind = $mainMod, comma


unbind = CTRL, SPACE
unbind = CTRL ALT, SPACE

unbind = $mainMod, Q
unbind = $mainMod, W
unbind = $mainMod, R
unbind = $mainMod, A
unbind = $mainMod, B
unbind = $mainMod, C
unbind = $mainMod, F
unbind = $mainMod, Z
unbind = $mainMod, apostrophe
unbind = $mainMod, equal
unbind = $mainMod, minus
unbind = $mainMod SHIFT, F
unbind = $mainMod SHIFT, A
unbind = $mainMod, SPACE
unbind = $mainMod CTRL, SPACE
unbind = $mainMod SHIFT, SPACE
unbind = $mainMod ALT, SPACE
unbind = $mainMod ALT, X
unbind = $mainMod ALT, V
unbind = $mainMod ALT, W
unbind = CTRL ALT, H
unbind = ALT, H
unbind = CTRL ALT, R
unbind = CTRL ALT SHIFT, R
unbind = $mainMod CTRL, MINUS
unbind = SUPER, BACKSPACE




unbind = SUPER, equal
unbind = SUPER, minus
unbind = SUPER, BACKSPACE
unbind = CTRL SHIFT, SPACE
unbind = $mainMod SHIFT, SPACE
unbind = $mainMod, E
unbind = $mainMod ALT, S
unbind = ALT, R
unbind = $mainMod, G
unbind = $mainMod SHIFT, T
unbind = $mainMod ALT SHIFT, W
unbind = $mainMod ALT, W
unbind = ALT, 0

# Modified Core Bindings (different from Dusky defaults)

bindd = $mainMod, Return, Launch Terminal, exec, uwsm-app -- $terminal
bindd = $mainMod, Q, Close Window, killactive,
bindd = $mainMod, B, Launch Browser, exec, uwsm-app -- $browser
bindd = $mainMod, A, Launch Gemini App, exec, uwsm-app -- chromium --app=https://gemini.google.com
bindd = $mainMod, C, Launch VSCode, exec, uwsm-app -- code
bindd = $mainMod, E, File Manager, exec, uwsm-app -- kitty --class file_manager -e yazi
bindd = $mainMod CTRL, E, Open Config in VSCode, exec, uwsm-app -- code ~/.config --goto ~/.config/hypr/edit_here/source/keybinds.conf:1

# Custom App Launchers
bindd = $mainMod CTRL, A, Launch Claude AI, exec, uwsm-app -- chromium --app=https://claude.ai/new
# bindd = $mainMod SHIFT, C, Launch ChessX, exec, QT_QPA_PLATFORM=xcb chessx

# Custom RDP/Remote Desktop Setup
bind = $mainMod, R, workspace, 9
bind = $mainMod, R, exec, $terminal -e ~/user_scripts/rdp.sh

# Modified Rofi Keybinds
bindd = $mainMod, SPACE, Launch Menu for Apps, exec, pkill rofi; rofi -show drun -run-command "uwsm app -- {cmd}"
bindd = $mainMod ALT, SPACE, Search Emojis, exec, uwsm-app -- pkill rofi; $scripts/rofi/emoji.sh
bindd = $mainMod CTRL, SPACE, Matuhow Keybinds, exec, uwsm-app -- pkill rofi; $scripts/rofi/keybindings.sh
# bindd = $mainMod SHIFT, SPACE, Sgen Theme Config, exec, uwsm-app -- pkill rofi; $scripts/rofi/rofi_theme.sh
bindd = $mainMod SHIFT, SPACE, System Menu, exec, uwsm-app -- pkill rofi; $scripts/rofi/system_menu.sh

# Wallpaper Controls
bindd = $mainMod CTRL, W, Wallpaper App, exec, uwsm-app -- waypaper
bindd = $mainMod, W, Cycle Wallpaper, exec, uwsm-app -- $scripts/theme_matugen/theme_ctl.sh random
bindd = $mainMod, bracketleft, Cycle Wallpaper Previous, exec, uwsm-app -- $scripts/theme_matugen/theme_ctl.sh previous
bindd = $mainMod, bracketright, Cycle Wallpaper Next, exec, uwsm-app -- $scripts/theme_matugen/theme_ctl.sh next

# Hyprsunset Toggle
# bindd = ALT CTRL, H, Hyprsunset Toggle, exec, ~/.config/hypr/scripts/hyprsunset_toggle.sh

# Display Scale Adjustment (changed from F/SHIFT F to equal/minus)
bindled = $mainMod, equal, Scale Up, exec, uwsm-app -- $scripts/hypr/adjust_scale.sh +
bindled = $mainMod, minus, Scale Down, exec, uwsm-app -- $scripts/hypr/adjust_scale.sh -

# Zoom Controls (changed from SUPER to mainMod CTRL)
# binded = $mainMod CTRL, equal, Zoom In, exec, sh -c "hyprctl keyword cursor:zoom_factor \"$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {print $2 * 1.25}')\""
# binded = $mainMod CTRL, minus, Zoom Out, exec, sh -c "hyprctl keyword cursor:zoom_factor \"$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {val = $2 / 1.25; if (val < 1.0) val = 1.0; print val}')\""

# Color Picker (changed from mainMod B to CTRL Print)
bindd = CTRL, Print, Color Picker, exec, pkill hyprpicker || hyprpicker -a

# Window Management (changed mainMod C→close to mainMod F→fullscreen)
bindd = $mainMod, F, Window Fullscreen, fullscreen, 0

# Notifications Toggle
# bindd = $mainMod ALT, N, Toggle Notifications Daemon, exec, systemctl --user is-active swaync &>/dev/null && (systemctl --user mask swaync && systemctl --user stop swaync) || (systemctl --user unmask swaync && systemctl --user start swaync)

# Music Recognition (removed --hold flag)
# bindd = $mainMod ALT, M, Music Recognition aka Shazam, exec, uwsm-app -- kitty --class music_recognition.sh -e $scripts/music/music_recognition.sh

# Hyprland Reload (changed from ALT R to CTRL SHIFT R)
bindld = $mainMod SHIFT, R, Reload Hyprland, exec, hyprctl reload
